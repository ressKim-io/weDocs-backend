# Java(messages + gRPC) stub 생성 — controller SSOT의 proto를 buf 원격 git input으로 소비(ADR-0010).
# 로컬 개발 = 로컬 경로. CI/재현 = git remote(태그 핀)로 inputs 교체.
version: v2
inputs:
  - directory: ../weDocs-controller/proto
  # canonical(CI, 태그 핀) — .github/workflows/ci.yml이 이 input을 CLI 인자로 덮어쓴다:
  #   buf generate 'https://github.com/ressKim-io/weDocs-controller.git#subdir=proto,ref=proto-v0.2.0'
  # (아래 주석 형태로 여기 직접 적으면 로컬 개발도 원격을 타므로, 오버라이드 방식을 쓴다.)
  # - git_repo: https://github.com/ressKim-io/weDocs-controller.git
  #   subdir: proto
  #   ref: proto-v0.2.0
plugins:
  # protobuf-java 4.34.1 런타임 대응
  - remote: buf.build/protocolbuffers/java:v34.1
    out: ws-gateway/build/generated/buf/java
  # grpc-java 1.82.1 런타임 대응
  - remote: buf.build/grpc/java:v1.82.1
    out: ws-gateway/build/generated/buf/java
  # doc-service — M2 1b: DocService 서버(DocServiceImplBase) 구현에 필요
  - remote: buf.build/protocolbuffers/java:v34.1
    out: doc-service/build/generated/buf/java
  - remote: buf.build/grpc/java:v1.82.1
    out: doc-service/build/generated/buf/java
  # gRPC API 문서 자동 생성 — Markdown 출력. `make proto-gen` 시 docs/proto/ 에 생성.
  - remote: buf.build/community/pseudomuto-doc
    out: docs/proto
    opt:
      - markdown,api.md
