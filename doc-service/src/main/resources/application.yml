spring:
  application:
    name: doc-service
  threads:
    virtual:
      enabled: true   # Java 25 Virtual Thread — I/O 바운드(DB) doc-service
  datasource:
    # 접속정보·시크릿은 환경변수 주입 필수(security.md) — 커밋된 dev 기본값을 제거해 non-dev 환경을 fail-closed로.
    # env 미설정 시: 미해결 placeholder가 리터럴로 통과 → Hikari `DatabaseDriver.fromJdbcUrl`에서
    # `IllegalArgumentException: 'url' must start with "jdbc"`로 기동 실패(silent/embedded fallback 없음, 실측 확인).
    # 로컬 dev 기본값 = application-dev.yml(SPRING_PROFILES_ACTIVE=dev, `make run-doc`).
    # 테스트: @ServiceConnection이 datasource 주입 + test/resources/application.yml이 이 main을 **완전 대체**
    # (동명 classpath 리소스, 병합 아님) → 이 키 제거 무영향(148 green).
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # 풀 크기 기본값(10) 암묵 의존 금지(config-contract-audit) — VT 대량 동시 요청에서도 DB
      # 커넥션 상한은 이 값. 정량 재조정은 M3 부하검증(SDD §15)에서.
      maximum-pool-size: 10
      # 비관 락(move 직렬화) 대기 상한 — 무제한 대기가 풀 고갈로 번지는 것 차단(1c 게이트 MED-7).
      # 세션 GUC라 모든 문장에 적용되지만, 직렬화된 move는 ms 단위라 정상 경합을 자르지 않는다.
      # ⚠️ Flyway도 같은 풀을 공유 — 트래픽 중 대형 DDL(ACCESS EXCLUSIVE) 마이그레이션은
      # 3s 내 락 실패 가능. 마이그레이션 창 설계 시 이 값 인지 필요(M3+).
      connection-init-sql: SET lock_timeout = '${WEDOCS_DB_LOCK_TIMEOUT:3s}'
  mvc:
    problemdetails:
      enabled: true   # 프레임워크 예외(검증 400 등)도 RFC 9457 ProblemDetail로 — 에러 스키마 단일화(error-handling P3)
  flyway:
    enabled: true   # 스키마 권위
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway가 스키마 소유, JPA는 매핑 검증만
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081   # ws-gateway=8080

wedocs:
  doc-service:
    grpc:
      # DocService 내부 gRPC 서버(M2 1b). engine=50051, gateway=8080, 위 REST(1c 예정)=8081과 별도 포트.
      port: 50052
      enabled: true   # 테스트 기본값은 false(src/test/resources/application.yml) — 포트 충돌 방지
      # 4MB — crdt-engine tonic 인바운드 한도(기존)와 정합. 런타임 기본값 암묵 의존 금지(secure-coding P2/P5).
      max-inbound-message-size: 4194304
    jwt:
      # RS256 개인키(PKCS#8 PEM) 위치 — prod/K8s는 Secret 파일 마운트(file:/...) 주입 필수(M5, ADR-0017).
      # 빈 값 = 시작 때 임시 키 생성 + WARN(dev 전용 — 재시작 시 기존 토큰 무효).
      private-key-location: ${WEDOCS_JWT_PRIVATE_KEY_LOCATION:}
      ttl: 24h   # ADR-0014: 예상 편집 세션보다 긴 TTL. 만료 = 재로그인(refresh token 비범위)
      issuer: wedocs-doc-service
    cors:
      # CORS 화이트리스트(콤마 구분) — 기본 = vite dev(5173). prod 도메인은 M5에서 env 주입.
      allowed-origins: ${WEDOCS_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# SpringDoc OpenAPI — Swagger UI + spec 자동 생성.
# prod에서는 env로 비활성화 가능(SPRINGDOC_SWAGGER_UI_ENABLED=false).
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
  api-docs:
    path: /v3/api-docs

# 구조화 로깅 — logback-spring.xml 삭제 후 Spring Boot 표준 프로퍼티만 사용한다.
# 이 구성에서 appender 이름은 기본값 CONSOLE·FILE, encoder는
# org.springframework.boot.logging.logback.StructuredLogEncoder, 프로파일 분기는
# application-{profile}.yml이며 ws-gateway와 키·값이 동일하다(요구사항 1.4).
# ⚠️ 갱신 지점 3곳: 이 파일 · application-prod.yml · src/test/resources/application.yml
#    (테스트 리소스는 동명 classpath 리소스라 main을 병합하지 않고 완전 대체한다)
logging:
  structured:
    format:
      # 파일 출력은 전 프로파일에서 구조화 — 요구사항 1.1(무조건 절).
      # logstash 포맷을 고른 근거: MDC·addKeyValue 쌍을 평면 멤버로 쓰고(ContextPairs.flat),
      # 예외를 stack_trace 단일 멤버로 써서 error.type 속성과 충돌하지 않는다.
      # ecs 포맷은 점 표기 키를 중첩 객체로 펼치고 자체 error 객체를 써서
      # "throwable + error.type 동시 기록"(요구사항 4.8)에서 error 멤버가 중복된다.
      file: logstash
      # console 키는 여기에 두지 않는다 — 기본/test/dev 콘솔은 Spring Boot 기본 평문 패턴(요구사항 1.3).
      # prod만 application-prod.yml에서 console: logstash로 덮는다(요구사항 1.2).
      # 같은 이유로 application-dev.yml에도 로깅 키를 두지 않는다 — 키 부재가 곧 평문 콘솔이므로
      # dev에 로깅 블록을 두면 기본 동작을 두 곳에서 중복 표현하고 드리프트 지점만 늘어난다.
  file:
    name: logs/app.json     # 구 logs/error.json(ERROR 전용) 대체 — 수집기 tail 재설정 필요(Migration_Note)
  logback:
    rollingpolicy:
      # 볼륨 산정 근거(요구사항 1.5) — 임계값이 ERROR → INFO로 내려가면서 구 100MB cap의 전제가 무효.
      #   라인 크기: 스택트레이스 없는 구조화 이벤트 1건 ≈ 500B(실측 기준: 구 error.json의
      #             핸드셰이크 라인 ≈ 530B). 스택트레이스 동반 ERROR 라인은 수 KB.
      #   이벤트율: NFR 상한 2000 동시 세션, 평균 세션 30분 → 신규 연결 ≈ 1.1/s.
      #             연결당 구조화 이벤트 3건(handshake·open·close) → 정상 ≈ 3~5/s.
      #             재연결 폭주(2000 세션이 60초 내 재접속) → 순간 ≈ 100/s.
      #   일 볼륨: 5/s × 500B × 86400 ≈ 216MB/day.
      #   보존 목표: 수집기(fluentbit/vector) 중단 24시간을 버티는 로컬 버퍼 → cap ≥ 1일 볼륨.
      max-file-size: 20MB   # 216MB/day → 약 11회/일 롤링(파일 수 관리 가능)
      total-size-cap: 500MB # ≈ 2일 버퍼. 파일은 아카이브가 아니라 수집 버퍼라는 전제
      max-history: 7        # 일 단위 보존 상한(실효 상한은 total-size-cap)
